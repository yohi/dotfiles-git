customCommands:
  - key: "<c-a>"
    context: "files"
    description: "nxc: generate Conventional Commit (local AI)"
    command: "NEXUS_COMMIT_LLM_TIMEOUT_MS=180000 nxc --staged --auto-start-nexus"
    output: "terminal"
  - key: "<c-b>"
    context: "files"
    description: "Gemini: generate Conventional Commit (terminal)"
    loadingText: "Generating commit message with Gemini..."
    command: "lg-gemini-commit"
    output: "terminal"
  - key: "<c-g>"
    context: "global"
    description: "Gemini: Create Pull Request"
    command: "lg-gemini-pr"
    output: "terminal"
